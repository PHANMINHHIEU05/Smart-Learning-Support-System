<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLSS Vocabulary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">Smart Learning</p>
          <h1>Vocabulary</h1>
        </div>
        <p class="connection-state is-connected">Local</p>
        <button id="refreshSelection" class="icon-button" title="Refresh selected word">
          R
        </button>
      </header>

      <section class="panel">
        <label for="term">Selected word</label>
        <div class="term-row">
          <input id="term" type="text" maxlength="255" />
          <button
            id="playSelectedAudio"
            class="audio-button term-audio-button"
            title="Listen to pronunciation"
          >
            Listen
          </button>
        </div>

        <div id="lookupSummary" class="lookup-summary" hidden>
          <div class="summary-heading">
            <div>
              <p id="summaryTerm" class="summary-term"></p>
              <p id="summaryPhonetic" class="summary-phonetic"></p>
            </div>
            <button id="playAudio" class="audio-button" hidden>Listen</button>
          </div>
          <div id="savedState" class="saved-state"></div>
          <div id="translationResult" class="translation-result"></div>
          <div id="definitionResult" class="definition-result"></div>
        </div>

        <label for="meaning">Vietnamese meaning</label>
        <textarea id="meaning" rows="3"></textarea>

        <div id="lexicalDetails" class="lexical-details" hidden>
          <div class="lexical-row">
            <span id="partOfSpeech" class="badge"></span>
            <span id="phonetic" class="phonetic"></span>
          </div>
          <p id="definitionEnglish" class="definition"></p>
        </div>

        <label for="exampleSentence">Example sentence</label>
        <textarea id="exampleSentence" rows="3"></textarea>

        <div class="actions">
          <button id="lookupWord" class="secondary-button">Lookup</button>
          <button id="saveWord" class="primary-button">Save Word</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
