server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-learning-main-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai-worker:
    base-url: ${AI_WORKER_BASE_URL:http://localhost:8001}
    internal-token: ${AI_WORKER_INTERNAL_TOKEN:dev-internal-token}
