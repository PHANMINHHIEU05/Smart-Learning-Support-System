debug: false

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-learning-main-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  internal:
    service-token: ${APP_INTERNAL_SERVICE_TOKEN:dev-internal-token}
  security:
    jwt:
      enabled: ${APP_SECURITY_JWT_ENABLED:true}
      issuer-uri: ${APP_SECURITY_JWT_ISSUER_URI:}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:}
      secret: ${APP_SECURITY_JWT_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai-worker:
    base-url: ${AI_WORKER_BASE_URL:http://localhost:8001}
    internal-token: ${AI_WORKER_INTERNAL_TOKEN:dev-internal-token}
