debug: false

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-learning-main-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  internal:
    service-token: ${APP_INTERNAL_SERVICE_TOKEN:dev-internal-token}
  security:
    jwt:
      enabled: ${APP_SECURITY_JWT_ENABLED:true}
      issuer-uri: ${APP_SECURITY_JWT_ISSUER_URI:}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:}
      secret: ${APP_SECURITY_JWT_SECRET:}
      supabase-url: ${SUPABASE_URL:}
      supabase-anon-key: ${SUPABASE_ANON_KEY:}
      remote-fallback-enabled: ${APP_SECURITY_JWT_REMOTE_FALLBACK_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai-worker:
    base-url: ${AI_WORKER_BASE_URL:http://localhost:8000}
    internal-token: ${AI_WORKER_INTERNAL_TOKEN:dev-internal-token}
    vocabulary-enabled: ${AI_WORKER_VOCABULARY_ENABLED:true}
  vocabulary:
    cache-ttl-days: ${VOCABULARY_CACHE_TTL_DAYS:7}
    personal:
      user-id: ${PERSONAL_VOCAB_USER_ID:00000000-0000-0000-0000-000000000001}
    extension:
      pairing-code-ttl-minutes: ${VOCABULARY_EXTENSION_PAIRING_CODE_TTL_MINUTES:10}
      session-ttl-days: ${VOCABULARY_EXTENSION_SESSION_TTL_DAYS:90}
